name: Deploy docs and game to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build MkDocs site
        run: |
          pip install mkdocs-material
          mkdocs build

      - name: Add HTML5 game under /play
        run: |
          mkdir -p site/play
          cp index.html site/play/
          cp -r app site/play/
          mkdir -p "site/play/1-AlienAttack/Alien Attack K00203642"
          for dir in assets SoundFX OriginalMusic; do
            cp -r "1-AlienAttack/Alien Attack K00203642/$dir" \
                  "site/play/1-AlienAttack/Alien Attack K00203642/"
          done
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
