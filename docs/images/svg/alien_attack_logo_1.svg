<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Multi-stage neon bloom filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Wide outer bloom -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="wideBloom"/>
      <!-- Tight intense halo -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="tightHalo"/>
      <!-- Soft edge blur -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="sharpEdge"/>
      
      <!-- Merge bloom layers behind sharp original graphic -->
      <feMerge>
        <feMergeNode in="wideBloom"/>
        <feMergeNode in="tightHalo"/>
        <feMergeNode in="sharpEdge"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hot pink to white vertical gradient fill -->
    <linearGradient id="textCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffb3c1"/>
      <stop offset="100%" stop-color="#ff1a40"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#050505"/>

  <!-- Outer deep red halo -->
  <text x="50%" y="60%" text-anchor="middle"
        font-family="Impact, sans-serif" font-size="72" font-weight="bold"
        fill="#ff0022" stroke="#ff0022" stroke-width="8"
        filter="url(#neon-glow)">
    Alien Attack
  </text>

  <!-- Bright luminous core on top -->
  <text x="50%" y="60%" text-anchor="middle"
        font-family="Impact, sans-serif" font-size="72" font-weight="bold"
        fill="url(#textCore)">
    Alien Attack
  </text>
</svg>