<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="100%" height="100%">
  <defs>
    <!-- Multi-stage neon bloom filter with animated pulse -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Wide diffuse bloom (pulsing) -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="wideBloom">
        <animate attributeName="stdDeviation" values="12; 22; 12" dur="2.4s" repeatCount="indefinite" />
      </feGaussianBlur>
      <!-- Mid-range rich red halo (pulsing) -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="midBloom">
        <animate attributeName="stdDeviation" values="6; 11; 6" dur="2.4s" repeatCount="indefinite" />
      </feGaussianBlur>
      <!-- Intense tight halo -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="tightHalo">
        <animate attributeName="stdDeviation" values="2.5; 4.5; 2.5" dur="2.4s" repeatCount="indefinite" />
      </feGaussianBlur>
      <!-- Sharp edge glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="sharpEdge"/>
      
      <feMerge>
        <feMergeNode in="wideBloom"/>
        <feMergeNode in="midBloom"/>
        <feMergeNode in="tightHalo"/>
        <feMergeNode in="sharpEdge"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hot pink to luminous white vertical gradient fill with breathing core -->
    <linearGradient id="textCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffb8c6">
        <animate attributeName="stop-color" values="#ffb8c6; #ffd6de; #ffb8c6" dur="2.4s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#ff5c7a">
        <animate attributeName="stop-color" values="#ff5c7a; #ff3b60; #ff5c7a" dur="2.4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff1a40">
        <animate attributeName="stop-color" values="#ff1a40; #e60026; #ff1a40" dur="2.4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <style>
      @keyframes neonPulse {
        0%, 100% {
          opacity: 0.72;
          transform: scale(0.995);
          transform-origin: center;
        }
        50% {
          opacity: 1.0;
          transform: scale(1.0);
          transform-origin: center;
        }
      }
      
      @keyframes corePulse {
        0%, 100% {
          opacity: 0.90;
        }
        50% {
          opacity: 1.0;
        }
      }

      .glow-layer {
        animation: neonPulse 2.4s ease-in-out infinite;
      }

      .core-layer {
        animation: corePulse 2.4s ease-in-out infinite;
      }
    </style>
  </defs>



